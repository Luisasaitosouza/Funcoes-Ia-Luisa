<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Animal - Pergunta & Resposta</title>
    <!-- Fonte e Ícones FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="overlay"></div>

    <!-- Modal Principal 3D -->
    <main class="modal-card">
        <!-- Elementos Decorativos 3D em Background -->
        <div class="glow-effect"></div>
        <div class="shape-3d shape-1"></div>
        <div class="shape-3d shape-2"></div>

        <header class="modal-header">
            <div class="icon-3d">
                <i class="fa-solid fa-paw"></i>
            </div>
            <h1>Animal<span class="highlight">IQ</span></h1>
            <p>Pergunte sobre qualquer animal e descubra curiosidades e notícias!</p>
        </header>

        <!-- Formulário de Pergunta -->
        <form id="form-pergunta" class="input-group">
            <input 
                type="text" 
                id="campo-pergunta" 
                placeholder="Ex: Qual é o animal mais rápido do mundo?" 
                autocomplete="off"
                required
            >
            <button type="submit" id="btn-enviar" class="btn-3d">
                <span>Perguntar</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

        <!-- Perguntas Rápidas -->
        <div class="sugestoes">
            <span>Sugestões:</span>
            <button class="chip">Onde vive o urso polar?</button>
            <button class="chip">Qual o maior mamífero?</button>
            <button class="chip">Gatos conseguem ver no escuro?</button>
        </div>

        <!-- Área de Resposta -->
        <section id="caixa-resposta" class="resposta-container oculto">
            <div class="resposta-header">
                <h3><i class="fa-solid fa-robot"></i> Resposta:</h3>
                <!-- Botão de Leitura de Voz por I.A -->
                <button id="btn-voz" class="btn-voz" title="Ouvir resposta com voz I.A">
                    <i class="fa-solid fa-volume-high"></i> Ouvir Voz
                </button>
            </div>
            
            <p id="texto-resposta" class="texto-resposta"></p>

            <!-- Card da Notícia / Saiba Mais -->
            <div id="card-noticia" class="card-noticia">
                <i class="fa-solid fa-newspaper"></i>
                <div class="noticia-info">
                    <h4>Mais informações & Notícia relacionada</h4>
                    <a id="link-noticia" href="#" target="_blank" rel="noopener noreferrer">
                        Ler artigo completo sobre o tema <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
